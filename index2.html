<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小松鼠的橡果森林 · 一场有始有终的冒险</title>
<style>
:root{
  --bg1:#fdf6e3; --bg2:#f6e8c8; --ink:#4a3623; --ink2:#7a6248;
  --oak:#b0722d; --oak-d:#8a541c; --leaf:#6f9b4e; --leaf-d:#4e7434;
  --gold:#e8a13a; --sky:#bfe3d9; --card:#fffdf6; --line:#e5d5b3;
  --red:#d96a4e; --blue:#5b8bb0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
  overflow:hidden;
}
/* ---------- 场景容器 ---------- */
.scene{
  position:fixed; inset:0; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  padding:24px; overflow-y:auto;
  animation:fadeIn .6s ease both;
}
.scene.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 3px rgba(232,161,58,.4))}50%{filter:drop-shadow(0 0 14px rgba(232,161,58,.9))}}
@keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}

/* ---------- 通用卡片 / 按钮 ---------- */
.card{
  background:var(--card); border:2px solid var(--line); border-radius:22px;
  box-shadow:0 10px 30px rgba(122,98,72,.15);
  padding:32px 36px; max-width:720px; width:100%;
}
.btn{
  display:inline-block; cursor:pointer; border:none; border-radius:999px;
  font-size:17px; font-weight:700; padding:14px 34px; letter-spacing:1px;
  background:linear-gradient(135deg,var(--oak),var(--oak-d)); color:#fff;
  box-shadow:0 6px 0 var(--oak-d), 0 10px 18px rgba(138,84,28,.35);
  transition:transform .12s, box-shadow .12s; user-select:none;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--oak-d)}
.btn.ghost{background:#fff; color:var(--oak); border:2px solid var(--oak); box-shadow:0 4px 0 var(--line)}
.tag{
  display:inline-block; background:var(--gold); color:#fff; font-size:12px;
  padding:3px 12px; border-radius:999px; letter-spacing:2px; font-weight:700;
}
h1{font-size:40px; line-height:1.25; margin:14px 0 18px}
h2{font-size:26px; margin-bottom:14px}
p{line-height:1.9; color:var(--ink2); font-size:16px}
.center{text-align:center}
.mt{margin-top:22px}

/* ---------- 顶部状态栏 ---------- */
#hud{
  position:fixed; top:0; left:0; right:0; z-index:50; display:none;
  align-items:center; justify-content:space-between;
  padding:10px 20px; background:rgba(255,253,246,.92); border-bottom:2px solid var(--line);
  backdrop-filter:blur(6px);
}
#hud .left{display:flex; align-items:center; gap:10px; font-weight:800; color:var(--oak)}
#hud .right{display:flex; align-items:center; gap:16px; font-size:14px; color:var(--ink2)}
.hearts{font-size:18px; letter-spacing:2px}
#nutCount{font-weight:800; color:var(--oak)}

/* ---------- 背景 ---------- */
#bgWrap{position:fixed; inset:0; z-index:0; pointer-events:none}
.tree{position:absolute; bottom:0; opacity:.9}

/* ---------- 场景1：封面 ---------- */
.squirrel-hero{width:170px; animation:float 3.2s ease-in-out infinite}
.pagenav{display:flex; gap:12px; justify-content:center; margin-top:24px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:.3s}
.dot.on{background:var(--oak); width:26px}
.story-page{display:none; animation:fadeIn .5s both}
.story-page.on{display:block}
.story-illu{width:120px; margin:0 auto 10px; display:block; animation:float 3s infinite}

/* ---------- 场景2：对话 ---------- */
.dialog-box{
  max-width:720px; width:100%; background:var(--card);
  border:2px solid var(--line); border-radius:22px; padding:28px 32px;
  box-shadow:0 10px 30px rgba(122,98,72,.15); position:relative;
}
.dialog-name{
  position:absolute; top:-16px; left:26px; background:var(--oak); color:#fff;
  font-weight:800; padding:5px 18px; border-radius:999px; font-size:14px;
}
.dialog-text{font-size:17px; line-height:1.9; min-height:70px}
.choices{display:flex; flex-direction:column; gap:12px; margin-top:20px}
.choice{
  cursor:pointer; border:2px solid var(--line); border-radius:14px;
  background:#fff; padding:14px 18px; font-size:16px; text-align:left;
  transition:.18s; line-height:1.6;
}
.choice:hover{border-color:var(--oak); background:#fff8ec; transform:translateX(6px)}
.choice .mark{font-weight:800; margin-right:8px}
.choice.good .mark{color:var(--leaf-d)}
.choice.bad .mark{color:var(--red)}
.feedback{margin-top:14px; font-size:15px; min-height:24px; color:var(--leaf-d); font-weight:700}

/* ---------- 场景3：接橡果游戏 ---------- */
#gameArea{
  position:relative; width:min(760px,94vw); height:min(560px,72vh);
  background:linear-gradient(180deg,#d8ecff 0%,#eef7e8 70%,#cfe3b8 70%,#b9d69a 100%);
  border:3px solid var(--line); border-radius:24px; overflow:hidden;
  box-shadow:0 14px 40px rgba(122,98,72,.22); touch-action:none;
}
#gameTree{position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:340px; pointer-events:none}
#basket{
  position:absolute; bottom:14px; width:96px; height:64px;
  transition:left .05s linear; z-index:5; pointer-events:none;
}
