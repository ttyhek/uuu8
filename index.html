<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #1e3a5f;
      line-height: 1.9;
      background: #ffffff;
    }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 24px;
      text-align: center;
    }
    section:nth-child(odd) { background: #ffffff; }
    section:nth-child(even) { background: #eef5fd; }

    h1 {
      font-size: 48px;
      font-weight: 800;
      color: #1e3a5f;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    h2 {
      font-size: 36px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 16px;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 3px;
      background: #1e6fd9;
      border-radius: 2px;
    }
    p {
      font-size: 18px;
      max-width: 620px;
      color: #5a7a9a;
    }

    .tag {
      display: inline-block;
      background: #1e6fd9;
      color: #fff;
      padding: 8px 20px;
      border-radius: 24px;
      margin: 8px;
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .tag:hover { transform: translateY(-3px); }

    /* 首页互动弹窗：水滴玻璃质感 */
    .popup-box {
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(238,245,253,0.85));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40% 40% 40% 40% / 30% 30% 30% 30%;
      padding: 70px 60px;
      box-shadow:
        0 8px 32px rgba(30,111,217,0.18),
        inset 0 0 40px rgba(255,255,255,0.6);
      max-width: 560px;
      border: 1px solid rgba(30,111,217,0.15);
      overflow: hidden;
    }
    .popup-box::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(30,111,217,0.08), transparent 60%);
      pointer-events: none;
    }
    .popup-box h1 {
      font-size: 32px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .popup-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .popup-btns button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 30px;
      border: 2px solid #1e6fd9;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-yes {
      background: #1e6fd9;
      color: #fff;
    }
    .btn-yes:hover {
      background: #1558b0;
      transform: translateY(-2px);
    }
    .btn-no {
      background: #fff;
      color: #1e6fd9;
    }
    .btn-no:hover {
      background: #eef5fd;
      transform: translateY(-2px);
    }

    /* 自我介绍：左头像右文字 */
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 900px;
      flex-wrap: wrap;
    }
    .avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #1e6fd9;
      box-shadow: 0 8px 24px rgba(30,111,217,0.25);
      transition: transform 0.3s;
    }
    .avatar:hover { transform: scale(1.05); }
    .hero-text { text-align: left; max-width: 520px; }

    /* 放大后的名字 */
    .hero-title {
      font-size: 56px;
      font-weight: 800;
      color: #1e3a5f;
      letter-spacing: -1px;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    /* 名字下面的信息 */
    .hero-sub {
      font-size: 20px;
      color: #1e6fd9;
      font-weight: 600;
      letter-spacing: 2px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- 第一页：互动弹窗 -->
  <section id="home">
    <div class="popup-box">
      <h1>听说我是坏女人，你觉得呢</h1>
      <div class="popup-btns">
        <button class="btn-yes" onclick="chooseYes()">没我坏</button>
        <button class="btn-no" onclick="chooseNo()">让我看看多坏</button>
      </div>
    </div>
  </section>

  <!-- 第二页：自我介绍 -->
  <section id="about">
    <div class="hero">
      <img src="avatar.jpg" alt="我的头像" class="avatar">
      <div class="hero-text">
        <h1 class="hero-title">你好小姐，我是琥珀</h1>
        <p class="hero-sub">23T 天秤 INTJ</p>
      </div>
    </div>
  </section>

  <!-- 第三页：标签 -->
  <section id="skills">
    <h2>我的标签</h2>
    <div>
      <span class="tag">爱学习</span>
      <span class="tag">爱折腾</span>
      <span class="tag">GitHub 新手</span>
    </div>
  </section>

  <!-- 第四页：联系 -->
  <section id="contact">
    <h2>联系我</h2>
    <p>邮箱：你的邮箱@example.com</p>
  </section>

  <script>
    function chooseYes() {
      document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
    }
    function chooseNo() {
      document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
</html>

</body>
</html>
