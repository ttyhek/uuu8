<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      color: #333;
      line-height: 1.8;
    }

    /* 顶部导航栏 */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      z-index: 100;
    }
    nav a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
      transition: color 0.2s;
    }
    nav a:hover { color: #3498db; }

    /* 每个区块 */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 20px;
      text-align: center;
    }
    section:nth-child(odd) { background: #f5f7fa; }
    section:nth-child(even) { background: #ffffff; }

    h1 { font-size: 42px; color: #2c3e50; margin-bottom: 20px; }
    h2 { font-size: 32px; color: #2c3e50; margin-bottom: 20px; }
    p { font-size: 18px; max-width: 600px; }

    .tag {
      display: inline-block;
      background: #eaf4fd;
      color: #2980b9;
      padding: 6px 16px;
      border-radius: 20px;
      margin: 6px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav>
    <a href="#home">首页</a>
    <a href="#about">关于我</a>
    <a href="#skills">技能</a>
    <a href="#contact">联系</a>
  </nav>

  <!-- 首页 -->
  <section id="home">
    <h1>你好，我是琥珀 </h1>
    <p>一个黑长直御姐。</p>
  </section>

  <!-- 关于我 -->
  <section id="about">
    <h2>关于我</h2>
    <p>我喜欢吃生蚝。</p>
  </section>

  <!-- 技能 -->
  <section id="skills">
    <h2>我的标签</h2>
    <div>
      <span class="tag">爱老婆</span>
      <span class="tag">爱折腾</span>
      <span class="tag">爱睡觉</span>
    </div>
  </section>

  <!-- 联系 -->
  <section id="contact">
    <h2>联系我</h2>
    <p>邮箱：233333@example.com</p>
  </section>

</body>
</html>
