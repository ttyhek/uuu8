<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我和你belike↑ · 舞会邀请</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Long+Cang&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:#0a0608;
    font-family:'Noto Serif SC',serif;
    color:#e8dcc8;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ===== 舞厅背景 ===== */
  .ballroom-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(180,130,80,.12), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(120,60,100,.1), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(80,60,120,.08), transparent 55%),
      linear-gradient(180deg,#0a0608,#120a0e 50%,#0a0608);
  }
  .ballroom-bg::after{
    content:'';position:absolute;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
    opacity:.4;
  }

  .dust{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .dust span{
    position:absolute;border-radius:50%;
    background:#ffd8a0;opacity:.25;
    animation:floatDust linear infinite;
  }
  @keyframes floatDust{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    10%{opacity:.35;}
    90%{opacity:.35;}
    100%{transform:translateY(-10vh) scale(1);opacity:0;}
  }

  /* ===== 通用屏 ===== */
  .screen{
    position:relative;z-index:5;
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:3rem 1.5rem;
    transition:opacity 1s ease, transform 1s ease;
  }
  .screen.leaving{opacity:0;transform:scale(.94);pointer-events:none;}
  .screen.hidden{display:none;}

  .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.85rem;
    color:#8a7560;
    letter-spacing:.35em;
    text-transform:uppercase;
    margin-bottom:2.5rem;
    opacity:0;
    animation:fadeIn 1.5s ease .3s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}

  /* ===== 第一屏：报名 ===== */
  .signup-title{
    font-family:'Long Cang',cursive;
    font-size:clamp(1.6rem,4.5vw,2.4rem);
    color:#f0e0c8;
    margin-bottom:.8rem;
    text-shadow:0 0 30px rgba(255,200,140,.2);
    opacity:0;
    animation:fadeIn 1.5s ease .6s forwards;
  }
  .signup-sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.9rem;
    color:#8a7560;
    letter-spacing:.2em;
    margin-bottom:2.5rem;
    opacity:0;
    animation:fadeIn 1.5s ease .9s forwards;
  }

  .name-input-wrap{
    position:relative;
    width:min(360px,85vw);
    margin-bottom:2rem;
    opacity:0;
    animation:fadeIn 1.5s ease 1.2s forwards;
  }
  .name-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid #6a5540;
    padding:1rem .5rem;
    font-family:'Long Cang',cursive;
    font-size:1.5rem;
    color:#f0e0c8;
    text-align:center;
    outline:none;
    transition:border-color .4s ease;
  }
  .name-input::placeholder{
    color:#4a3a28;
    font-style:italic;
    font-family:'Cormorant Garamond',serif;
    font-size:1rem;
  }
  .name-input:focus{
    border-bottom-color:#c0a070;
    box-shadow:0 8px 20px -10px rgba(200,160,100,.4);
  }
  .name-underline{
    position:absolute;
    bottom:0;left:50%;
    width:0;height:1px;
    background:linear-gradient(90deg,transparent,#ffb7d0,transparent);
    transition:width .6s ease, left .6s ease;
  }
  .name-input:focus ~ .name-underline{width:100%;left:0;}

  .signup-btn{
    margin-top:1rem;
    padding:.9rem 2.5rem;
    background:transparent;
    border:1px solid #6a5540;
    border-radius:40px;
    color:#c0a070;
    font-family:'Noto Serif SC',serif;
    font-size:.85rem;
    letter-spacing:.3em;
    cursor:pointer;
    transition:all .4s ease;
    opacity:0;
    animation:fadeIn 1.5s ease 1.5s forwards;
  }
  .signup-btn:hover:not(:disabled){
    border-color:#ffb7d0;
    color:#ffd8e8;
    box-shadow:0 0 30px rgba(255,155,192,.3);
    transform:translateY(-2px);
  }
  .signup-btn:disabled{opacity:.3;cursor:not-allowed;}

  /* ===== 第二屏：信封 + 火漆 ===== */
  .envelope-stage{
    position:relative;
    width:min(420px,90vw);
    margin-bottom:4rem;
    perspective:1200px;
  }

  .feather{
    position:absolute;
    top:-80px;right:-24px;
    width:76px;height:200px;
    z-index:10;
    transform-origin:bottom center;
    animation:featherSway 5s ease-in-out infinite;
    pointer-events:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.7));
    transition:transform 1s ease, opacity 1s ease;
  }
  @keyframes featherSway{
    0%,100%{transform:rotate(-6deg) translateY(0);}
    50%{transform:rotate(4deg) translateY(-6px);}
  }
  .feather.fall{animation:featherFall 1.2s ease forwards;}
  @keyframes featherFall{
    0%{transform:rotate(-6deg) translateY(0);}
    30%{transform:rotate(-40deg) translateY(20px) translateX(-30px);}
    60%{transform:rotate(-80deg) translateY(60px) translateX(-60px);}
    100%{transform:rotate(-110deg) translateY(140px) translateX(-80px);opacity:0;}
  }

  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:1.6/1;
    transition:transform .6s ease;
    transform-style:preserve-3d;
  }
  .envelope-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#e8d8c0,#d4c0a0);
    border-radius:6px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.8),
      0 0 0 1px rgba(200,170,120,.3),
      inset 0 0 60px rgba(180,140,90,.15);
    overflow:hidden;
  }
  .envelope-body::before{
    content:'';position:absolute;top:0;left:0;right:0;height:60%;
    background:linear-gradient(160deg,#f0e0c8,#dcc8a8);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.1);
    z-index:2;
  }

  .watermark{
    position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.18;
    background-image:
      radial-gradient(circle at 25% 35%, transparent 0 18px, rgba(120,80,40,.35) 18px 19px, transparent 19px),
      radial-gradient(circle at 75% 65%, transparent 0 22px, rgba(120,80,40,.3) 22px 23px, transparent 23px),
      radial-gradient(circle at 50% 50%, transparent 0 40px, rgba(120,80,40,.15) 40px 41px, transparent 41px),
      repeating-linear-gradient(45deg, transparent 0 12px, rgba(140,100,60,.08) 12px 13px);
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  .watermark-text{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(3rem,8vw,5rem);
    color:rgba(140,90,50,.12);
    letter-spacing:.3em;z-index:1;pointer-events:none;white-space:nowrap;font-weight:300;
  }

  .envelope-q{
    position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
    font-family:'Long Cang',cursive;
    font-size:clamp(1.1rem,3.2vw,1.5rem);
    color:#5a3a28;white-space:nowrap;letter-spacing:.08em;z-index:4;
    text-shadow:0 1px 2px rgba(255,255,255,.4);
  }

  .envelope-name{
    position:absolute;top:18%;left:50%;transform:translateX(-50%);
    font-family:'Long Cang',cursive;
    font-size:clamp(1rem,2.8vw,1.3rem);
    color:#8a2040;
    letter-spacing:.05em;z-index:4;
    opacity:0;
    transition:opacity 1s ease;
    text-shadow:0 1px 2px rgba(255,255,255,.3);
  }
  .envelope-name.show{opacity:1;}

  /* ===== 火漆 ===== */
  .seals{
    position:absolute;
    bottom:-50px;left:50%;transform:translateX(-50%);
    display:flex;gap:1.6rem;
    z-index:8;
  }
  .seal-wrap{
    position:relative;
    width:82px;height:82px;
    cursor:pointer;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    transform-style:preserve-3d;
  }
  .seal-wrap:hover{transform:translateY(-10px) scale(1.1) rotateX(-8deg);}
  .seal-wrap:active{transform:translateY(-5px) scale(1.03) rotateX(-4deg);}

  .wax{
    position:absolute;inset:0;
    border-radius:52% 48% 50% 50% / 48% 52% 48% 52%;
    transition:all .35s ease;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='w'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23w)' opacity='0.25'/%3E%3C/svg%3E"),
      radial-gradient(circle at 38% 32%, rgba(255,255,255,.25), transparent 45%);
  }
  .wax::before{
    content:'';position:absolute;inset:-5px -3px -4px -3px;
    border-radius:48% 52% 46% 54% / 52% 46% 54% 46%;
    opacity:.75;filter:blur(1.5px);z-index:-1;
  }
  .wax::after{
    content:'';position:absolute;bottom:-6px;left:18%;
    width:20px;height:26px;
    border-radius:48% 52% 50% 50% / 60% 60% 40% 40%;
    opacity:.85;filter:blur(1.2px);
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }

  .seal-wrap.red .wax{
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n1'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n1)' opacity='0.22'/%3E%3C/svg%3E"),
      radial-gradient(circle at 35% 28%, #e04868 0%, #c03050 30%, #8a1830 75%, #5a0a18 100%);
    box-shadow:
      0 8px 20px rgba(140,20,50,.6), 0 2px 4px rgba(0,0,0,.4),
      inset 0 -4px 10px rgba(60,0,20,.7), inset 0 4px 8px rgba(255,180,200,.35),
      inset 0 0 20px rgba(255,100,140,.2);
  }
  .seal-wrap.red .wax::before{background:radial-gradient(circle at 40% 35%, rgba(255,180,200,.5), transparent 65%);}
  .seal-wrap.red .wax::after{background:linear-gradient(180deg,#a02848,#7a1830);}
  .seal-wrap.red:hover .wax{
    box-shadow:0 12px 32px rgba(200,40,80,.8), 0 2px 4px rgba(0,0,0,.4),
      inset 0 -4px 10px rgba(60,0,20,.7), inset 0 4px 10px rgba(255,200,220,.45),
      inset 0 0 30px rgba(255,120,160,.3);
  }

  .seal-wrap.gold .wax{
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n2)' opacity='0.22'/%3E%3C/svg%3E"),
      radial-gradient(circle at 35% 28%, #f4d070 0%, #e0b040 30%, #a07818 75%, #6a4a08 100%);
    box-shadow:
      0 8px 20px rgba(140,100,20,.6), 0 2px 4px rgba(0,0,0,.4),
      inset 0 -4px 10px rgba(60,40,0,.7), inset 0 4px 8px rgba(255,250,200,.45),
      inset 0 0 20px rgba(255,220,120,.25);
  }
  .seal-wrap.gold .wax::before{background:radial-gradient(circle at 40% 35%, rgba(255,250,200,.6), transparent 65%);}
  .seal-wrap.gold .wax::after{background:linear-gradient(180deg,#c0a030,#8a6010);}
  .seal-wrap.gold:hover .wax{
    box-shadow:0 12px 32px rgba(220,180,60,.8), 0 2px 4px rgba(0,0,0,.4),
      inset 0 -4px 10px rgba(60,40,0,.7), inset 0 4px 10px rgba(255,250,220,.55),
      inset 0 0 30px rgba(255,230,140,.35);
  }

  .seal-wrap.black .wax{
    background:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n3'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n3)' opacity='0.3'/%3E%3C/svg%3E"),
      radial-gradient(circle at 35% 28%, #6a5a68 0%, #4a3a48 30%, #2a1e28 75%, #0e080e 100%);
    box-shadow:
      0 8px 20px rgba(0,0,0,.75), 0 2px 4px rgba(0,0,0,.5),
      inset 0 -4px 10px rgba(0,0,0,.9), inset 0 4px 8px rgba(180,160,180,.25),
      inset 0 0 20px rgba(140,120,150,.15);
  }
  .seal-wrap.black .wax::before{background:radial-gradient(circle at 40% 35%, rgba(180,160,180,.3), transparent 65%);}
  .seal-wrap.black .wax::after{background:linear-gradient(180deg,#2a1e28,#0e080e);}
  .seal-wrap.black:hover .wax{
    box-shadow:0 12px 32px rgba(80,60,80,.85), 0 2px 4px rgba(0,0,0,.5),
      inset 0 -4px 10px rgba(0,0,0,.9), inset 0 4px 10px rgba(200,180,200,.35),
      inset 0 0 30px rgba(160,140,170,.25);
  }

  .imprint{
    position:absolute;inset:14px;
    border-radius:48% 52% 50% 50% / 52% 48% 52% 48%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif SC',serif;
    font-size:.68rem;line-height:1.2;text-align:center;
    letter-spacing:.03em;z-index:3;font-weight:500;
    transition:all .3s ease;
  }
  .seal-wrap.red .imprint{color:#ffd8e0;text-shadow:0 1px 1px rgba(0,0,0,.6),0 -1px 0 rgba(255,200,220,.3);}
  .seal-wrap.gold .imprint{color:#3a2a08;text-shadow:0 1px 1px rgba(255,250,200,.5),0 -1px 0 rgba(60,40,0,.4);}
  .seal-wrap.black .imprint{color:#d0c0d0;text-shadow:0 1px 1px rgba(0,0,0,.8),0 -1px 0 rgba(200,180,200,.2);}
  .imprint::before{
    content:'';position:absolute;inset:7px;
    border-radius:50% 48% 52% 50% / 48% 52% 48% 52%;
    border:1px solid rgba(0,0,0,.3);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.15);
    transition:all .3s ease;
  }
  .seal-wrap.gold .imprint::before{
    border-color:rgba(80,60,0,.4);
    box-shadow:inset 0 2px 3px rgba(80,60,0,.4), inset 0 -1px 2px rgba(255,250,200,.3);
  }
  .seal-wrap.black .imprint::before{border-color:rgba(0,0,0,.5);}

  .fingerprint{
    position:absolute;top:22%;right:18%;
    width:18px;height:14px;border-radius:50%;opacity:.15;
    background:repeating-radial-gradient(circle at 50% 50%, transparent 0 1.5px, rgba(0,0,0,.5) 1.5px 2px);
    transform:rotate(-20deg);pointer-events:none;z-index:4;
  }

  .seal-wrap.picked{
    transform:translateY(-18px) scale(1.18) rotateX(-12deg);
    animation:sealPress .7s ease;
  }
  @keyframes sealPress{
    0%{transform:translateY(-18px) scale(1.18) rotateX(-12deg);}
    25%{transform:translateY(-8px) scale(.94) rotateX(0deg);}
    55%{transform:translateY(-18px) scale(1.2) rotateX(-12deg);}
    100%{transform:translateY(-18px) scale(1.18) rotateX(-12deg);}
  }
  .seal-wrap.picked .wax{
    border-radius:54% 46% 50% 50% / 46% 54% 46% 54%;
    transform:scale(.95);
  }
  .seal-wrap.picked .wax::after{transform:scale(1.5) translateY(2px);opacity:1;}
  .seal-wrap.picked .imprint{transform:scale(.98);}
  .seal-wrap.faded{opacity:.2;transform:scale(.85);pointer-events:none;filter:blur(.5px);}

  .hint{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.9rem;
    color:#8a7560;
    letter-spacing:.2em;
    text-align:center;
    transition:opacity .5s ease;
  }
  .hint.changed{color:#c0a070;}

  .envelope.crack-red .envelope-body::after{
    content:'';position:absolute;top:0;bottom:0;left:50%;
    width:2px;
    background:linear-gradient(180deg,transparent,#ff6a8a,#c03050,transparent);
    box-shadow:0 0 20px #ff6a8a;
    transform:translateX(-50%) scaleY(0);
    animation:crackRed 1.2s ease forwards;z-index:5;
  }
  @keyframes crackRed{to{transform:translateX(-50%) scaleY(1);}}
  .envelope.melt-gold .envelope-body{animation:meltGold 1.4s ease forwards;}
  @keyframes meltGold{
    0%{filter:brightness(1);}
    50%{filter:brightness(1.8) sepia(.3);transform:scale(1.02);}
    100%{filter:brightness(2.5) sepia(.5);transform:scale(1.05);opacity:.6;}
  }
  .envelope.still-black .envelope-body{animation:stillBlack 3s ease forwards;}
  @keyframes stillBlack{
    0%,80%{transform:translate(0,0) rotate(0deg);}
    82%{transform:translate(-2px,0) rotate(-.5deg);}
    84%{transform:translate(2px,0) rotate(.5deg);}
    86%{transform:translate(-2px,0) rotate(-.5deg);}
    88%{transform:translate(2px,0) rotate(.5deg);}
    90%{transform:translate(0,0) rotate(0deg);}
    92%{transform:scale(1.05);}
    100%{transform:scale(1.1);opacity:0;}
  }

  .whisper-out{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    z-index:50;
    font-family:'Long Cang',cursive;
    font-size:clamp(1.4rem,4vw,2.2rem);
    color:#f0e0c8;text-align:center;
    pointer-events:none;opacity:0;
    transition:opacity .8s ease, transform .8s ease;
    text-shadow:0 0 30px rgba(255,200,140,.4);
    white-space:nowrap;
    padding:0 1rem;
  }
  .whisper-out.show{opacity:1;transform:translate(-50%,-50%) scale(1.05);}

  /* ============================================
     第三屏：抽签（欧美风）
     ============================================ */
  .draw-title{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(1.8rem,4.5vw,2.6rem);
    color:#f0e0c8;
    margin-bottom:.5rem;
    letter-spacing:.05em;
    text-shadow:0 0 30px rgba(255,200,140,.2);
  }
  .draw-title .ornament{
    display:block;
    font-size:.7em;
    color:#8a7050;
    margin-top:.5rem;
    letter-spacing:.4em;
    font-weight:400;
    font-style:italic;
  }
  .draw-sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.9rem;
    color:#8a7560;
    letter-spacing:.25em;
    margin-bottom:2.5rem;
    text-transform:uppercase;
    transition:color .4s ease;
  }

  /* ===== 扇形签架 ===== */
  .sticks-fan{
    position:relative;
    width:min(680px,96vw);
    height:420px;
    margin-bottom:1rem;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    perspective:1400px;
    transition:filter .8s ease;
  }
  /* 重抽次数越多，烛光越亮 */
  .sticks-fan.rewarm{filter:brightness(1.06);}
  .sticks-fan.rewarm2{filter:brightness(1.12);}
  .sticks-fan.rewarm3{filter:brightness(1.2);}

  .stick{
    position:absolute;
    bottom:0;
    width:52px;
    height:340px;
    cursor:pointer;
    transform-origin:bottom center;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1),
               filter .4s ease,
               opacity .4s ease;
    transform-style:preserve-3d;
  }

  .stick:nth-child(1){--angle:-42deg;--tx:-240px;--ty:20px;}
  .stick:nth-child(2){--angle:-28deg;--tx:-160px;--ty:4px;}
  .stick:nth-child(3){--angle:-14deg;--tx:-80px;--ty:-6px;}
  .stick:nth-child(4){--angle:0deg;--tx:0px;--ty:-10px;}
  .stick:nth-child(5){--angle:14deg;--tx:80px;--ty:-6px;}
  .stick:nth-child(6){--angle:28deg;--tx:160px;--ty:4px;}
  .stick:nth-child(7){--angle:42deg;--tx:240px;--ty:20px;}

  .stick .stick-inner{
    position:absolute;
    inset:0;
    border-radius:26px 26px 6px 6px;
    background:
      linear-gradient(180deg,
        #faf3e4 0%,
        #f4ead4 20%,
        #ede0c4 60%,
        #e0d0b0 100%);
    box-shadow:
      0 14px 36px rgba(0,0,0,.65),
      inset 0 0 0 1px rgba(180,150,110,.5),
      inset -6px 0 14px rgba(120,90,60,.25),
      inset 6px 0 14px rgba(120,90,60,.25);
    transform: rotate(var(--angle)) translateX(var(--tx)) translateY(var(--ty));
    transition:inherit;
    overflow:hidden;
  }
  .stick .stick-inner::before{
    content:'';
    position:absolute;
    top:14px;bottom:14px;
    left:10px;right:10px;
    border:1px solid rgba(180,140,70,.55);
    border-radius:18px 18px 4px 4px;
    pointer-events:none;
  }
  .stick .stick-inner::after{
    content:'';
    position:absolute;
    top:22px;bottom:22px;
    left:16px;right:16px;
    border:1px solid rgba(180,140,70,.3);
    border-radius:14px 14px 3px 3px;
    pointer-events:none;
  }

  .stick-num{
    position:absolute;
    top:38px;left:50%;
    transform:translateX(-50%) rotate(var(--angle));
    transform-origin:bottom center;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:600;
    font-size:1.1rem;
    color:#8a5a28;
    letter-spacing:.05em;
    transition:inherit;
    z-index:2;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .stick-label{
    position:absolute;
    top:80px;left:50%;
    transform:translateX(-50%) rotate(var(--angle)) translateY(0);
    transform-origin:bottom center;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.72rem;
    letter-spacing:.35em;
    color:#8a6a48;
    transition:inherit;
    z-index:2;
    white-space:nowrap;
    opacity:.75;
  }
  .stick-seal{
    position:absolute;
    bottom:24px;left:50%;
    width:14px;height:14px;
    border-radius:50%;
    transform:translateX(-50%) rotate(var(--angle));
    transform-origin:bottom center;
    background:radial-gradient(circle at 35% 35%, #c03050, #7a1830);
    box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 0 4px rgba(255,200,220,.3);
    transition:inherit;
    z-index:2;
  }

  .stick:hover .stick-inner,
  .stick:hover .stick-num,
  .stick:hover .stick-label,
  .stick:hover .stick-seal{
    transform: rotate(var(--angle)) translateX(var(--tx)) translateY(calc(var(--ty) - 22px));
  }
  .stick:hover .stick-inner{
    box-shadow:
      0 22px 48px rgba(0,0,0,.75),
      0 0 40px rgba(255,200,140,.25),
      inset 0 0 0 1px rgba(200,170,120,.6),
      inset -6px 0 14px rgba(120,90,60,.25),
      inset 6px 0 14px rgba(120,90,60,.25);
  }
  .stick:hover .stick-num{color:#c03050;}

  .stick.drawn .stick-inner,
  .stick.drawn .stick-num,
  .stick.drawn .stick-label,
  .stick.drawn .stick-seal{
    transform: rotate(0deg) translateX(0) translateY(-120px);
  }
  .stick.drawn{z-index:20;}
  .stick.drawn .stick-inner{
    box-shadow:
      0 30px 60px rgba(0,0,0,.8),
      0 0 60px rgba(255,200,140,.4),
      inset 0 0 0 1px rgba(220,180,120,.7);
  }

  .stick.faded{opacity:.12;filter:blur(1px);pointer-events:none;}

  /* ===== 舞伴签页 ===== */
  .partner-scroll{
    position:relative;
    max-width:600px;
    width:100%;
    margin-top:1.5rem;
    opacity:0;
    transform:translateY(30px);
    transition:opacity 1.2s ease, transform 1.2s ease;
    pointer-events:none;
  }
  .partner-scroll.show{
    opacity:1;transform:translateY(0);pointer-events:auto;
  }

  .scroll-frame{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,220,160,.06), transparent 60%),
      linear-gradient(160deg, #1a1015 0%, #12080d 50%, #0e0609 100%);
    border:1px solid #6a5030;
    border-radius:2px;
    padding:3rem 2.5rem;
    box-shadow:
      0 30px 80px rgba(0,0,0,.85),
      0 0 0 1px rgba(180,140,70,.2),
      inset 0 0 80px rgba(120,80,40,.15);
    overflow:hidden;
  }
  .scroll-frame::before{
    content:'';
    position:absolute;
    inset:12px;
    border:1px solid rgba(180,140,70,.45);
    border-radius:1px;
    pointer-events:none;
  }
  .scroll-frame::after{
    content:'';
    position:absolute;
    inset:18px;
    border:1px solid rgba(180,140,70,.2);
    border-radius:1px;
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:24px;height:24px;
    border-color:#b08a40;
    border-style:solid;
    border-width:0;
    opacity:.7;
  }
  .corner.tl{top:8px;left:8px;border-top-width:1px;border-left-width:1px;}
  .corner.tr{top:8px;right:8px;border-top-width:1px;border-right-width:1px;}
  .corner.bl{bottom:8px;left:8px;border-bottom-width:1px;border-left-width:1px;}
  .corner.br{bottom:8px;right:8px;border-bottom-width:1px;border-right-width:1px;}

  .scroll-ornament{
    text-align:center;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:.7rem;
    color:#8a7050;
    letter-spacing:.5em;
    text-transform:uppercase;
    margin-bottom:1.5rem;
  }
  .scroll-ornament::before,
  .scroll-ornament::after{
    content:'✦';
    margin:0 .8rem;
    color:#b08a40;
    font-size:.6rem;
    vertical-align:middle;
  }

  .scroll-roman{
    text-align:center;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:600;
    font-size:1rem;
    color:#b08a40;
    letter-spacing:.4em;
    margin-bottom:1rem;
  }

  .scroll-name{
    text-align:center;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:clamp(2rem,5.5vw,3rem);
    background:linear-gradient(180deg,#f4e0b0 0%, #d8b070 50%, #a07838 100%);

    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:.05em;
    margin-bottom:1.5rem;
    text-shadow:0 0 40px rgba(220,180,100,.25);
    line-height:1.2;
  }

  .scroll-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.8rem;
    margin:1.5rem auto;
    max-width:280px;
  }
  .scroll-divider::before,
  .scroll-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,#8a7050,transparent);
  }
  .scroll-divider .diamond{
    color:#b08a40;
    font-size:.6rem;
  }

  .scroll-desc{
    font-family:'Cormorant Garamond',serif;
    font-size:1.05rem;
    line-height:2;
    color:#c8b8a8;
    text-align:center;
    font-style:italic;
    margin-bottom:2rem;
  }
  .scroll-desc .hl{
    color:#ffb7d0;
    font-style:normal;
    font-family:'Noto Serif SC',serif;
    font-size:.95rem;
    letter-spacing:.03em;
  }

  .scroll-tags{
    display:flex;flex-wrap:wrap;gap:.6rem;
    justify-content:center;
    margin-bottom:1.5rem;
  }
  .scroll-tags span{
    font-family:'Cormorant Garamond',serif;
    font-size:.75rem;
    color:#c0a070;
    border:1px solid rgba(180,140,70,.5);
    padding:.35rem 1rem;
    border-radius:0;
    letter-spacing:.2em;
    text-transform:uppercase;
    font-style:italic;
    background:rgba(180,140,70,.05);
  }

  .scroll-seal{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1.5rem;
  }
  .scroll-seal .mini-wax{
    width:36px;height:36px;
    border-radius:50% 48% 52% 50% / 48% 52% 48% 52%;
    background:radial-gradient(circle at 35% 30%, #c03050, #7a1830);
    box-shadow:
      0 4px 10px rgba(0,0,0,.6),
      inset 0 -2px 4px rgba(60,0,20,.6),
      inset 0 2px 4px rgba(255,180,200,.3);
    display:flex;align-items:center;justify-content:center;
    color:#ffd0d8;
    font-size:.9rem;
    font-family:'Playfair Display',serif;
    font-style:italic;
  }

  /* ===== 按钮组：重新选签 + 继续 ===== */
  .scroll-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:1.2rem;
    margin-top:2rem;
    flex-wrap:wrap;
  }

  .continue-btn{
    padding:.8rem 2rem;
    background:transparent;
    border:1px solid #6a5540;
    color:#c0a070;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.85rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .4s ease;
  }
  .continue-btn:hover{
    border-color:#ffb7d0;
    color:#ffd8e8;
    box-shadow:0 0 30px rgba(255,155,192,.25);
    letter-spacing:.4em;
  }

  /* 重新选签按钮：更轻、更暧昧 */
  .redraw-btn{
    padding:.8rem 2rem;
    background:transparent;
    border:1px solid #4a3a30;
    color:#8a7560;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.85rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .4s ease;
    position:relative;
  }
  .redraw-btn:hover{
    border-color:#c0a070;
    color:#e0c8a0;
    box-shadow:0 0 30px rgba(200,160,100,.2);
    letter-spacing:.4em;
  }
  .redraw-btn::after{
    content:'↻';
    position:absolute;
    right:-1.2rem;
    top:50%;
    transform:translateY(-50%);
    font-size:.9rem;
    opacity:0;
    transition:opacity .3s ease, right .3s ease;
    color:#c0a070;
  }
  .redraw-btn:hover::after{
    opacity:1;
    right:-1.5rem;
  }

  /* 重抽提示 */
  .redraw-note{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:.75rem;
    color:#6a5540;
    letter-spacing:.2em;
    margin-top:1rem;
    opacity:0;
    transition:opacity .6s ease;
  }
  .redraw-note.show{opacity:1;}

  @media(max-width:720px){
    .sticks-fan{height:340px;}
    .stick{width:44px;height:280px;}
    .stick:nth-child(1){--tx:-180px;}
    .stick:nth-child(2){--tx:-120px;}
    .stick:nth-child(3){--tx:-60px;}
    .stick:nth-child(5){--tx:60px;}
    .stick:nth-child(6){--tx:120px;}
    .stick:nth-child(7){--tx:180px;}
    .stick-num{font-size:.9rem;top:30px;}
    .stick-label{font-size:.6rem;top:64px;}
    .scroll-frame{padding:2rem 1.5rem;}
    .scroll-actions{flex-direction:column;gap:.8rem;}
    .redraw-btn::after{right:-1rem;}
  }

  @media(max-width:520px){
    .sticks-fan{height:300px;}
    .stick{width:38px;height:250px;}
    .stick:nth-child(1){--tx:-140px;--angle:-46deg;}
    .stick:nth-child(2){--tx:-94px;}
    .stick:nth-child(3){--tx:-48px;}
    .stick:nth-child(5){--tx:48px;}
    .stick:nth-child(6){--tx:94px;}
    .stick:nth-child(7){--tx:140px;--angle:46deg;}
    .stick-label{display:none;}
  }
</style>
</head>
<body>

<div class="ballroom-bg"></div>
<div class="dust" id="dust"></div>

<div class="whisper-out" id="whisperOut"></div>

<!-- ===== 第一屏：报名 ===== -->
<section class="screen" id="screen1">

<!-- ===== 第二屏：信封 + 火漆 ===== -->
<section class="screen hidden" id="screen2">

  <div class="envelope-stage">
    <div class="feather" id="feather">
      <svg viewBox="0 0 76 200" xmlns="http://www.w3.org/2000/svg">
        <defs>

        <path d="M38 12 Q54 44 56 88 Q56 132 44 176 Q40 188 38 194 Q36 188 32 176 Q20 132 20 88 Q22 44 38 12 Z"
              fill="url(#featherGrad)" stroke="#8a7050" stroke-width=".6"/>

        <path d="M38 34 Q46 50 48 66" stroke="#9a8060" stroke-width=".5" fill="none" opacity=".6"/>
        <path d="M38 34 Q30 50 28 66" stroke="#9a8060" stroke-width=".5" fill="none" opacity=".6"/>
        <path d="M38 66 Q47 82 49 98" stroke="#9a8060" stroke-width=".5" fill="none" opacity=".6"/>

    <div class="envelope" id="envelope">

      </div>

      <div class="seals">

  <div class="hint" id="hint">选一个火漆 · 盖上你的回答</div>

<!-- ===== 第三屏：抽签 ===== -->
<section class="screen hidden" id="screen3">
  <div class="eyebrow">— the ball begins —</div>
  <div class="draw-title">
    抽取你的舞伴
    <span class="ornament">— draw your partner —</span>
  </div>
  <div class="draw-sub" id="drawSub">Seven sticks · One fate</div>

  <div class="sticks-fan" id="sticksFan">
    <div class="stick" data-partner="0">
      <div class="stick-inner"></div>

    </div>

      <div class="stick-label">WIFE</div>

      <div class="stick-inner"></div>

      <div class="stick-label">A PROMISE</div>
      <div class="stick-seal"></div>

  <div class="partner-scroll" id="partnerScroll">
    <div class="scroll-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="scroll-ornament">Your Partner</div>
      <div class="scroll-roman" id="scrollRoman"></div>

<script>
  /* ===== 浮尘 ===== */
  const dust = document.getElementById('dust');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (Math.random() * 20 + 15) + 's';
    s.style.animationDelay = (Math.random() * 20) + 's';
    dust.appendChild(s);
  }

  /* ===== 第一屏 ===== */
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const screen3 = document.getElementById('screen3');
  const nameInput = document.getElementById('nameInput');
  const signupBtn = document.getElementById('signupBtn');
  const envelopeName = document.getElementById('envelopeName');
  let userName = '';

  nameInput.addEventListener('input', () => {
    userName = nameInput.value.trim();
    signupBtn.disabled = userName.length === 0;
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && userName.length > 0) signupBtn.click();
  });

  signupBtn.addEventListener('click', () => {
    if (!userName) return;
    screen1.classList.add('leaving');
    setTimeout(() => {
      screen1.classList.add('hidden');
      screen2.classList.remove('hidden');
      envelopeName.textContent = '致 ' + userName;
      setTimeout(() => envelopeName.classList.add('show'), 600);
    }, 800);
  });

  /* ===== 第二屏 ===== */
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');
  const whisperOut = document.getElementById('whisperOut');
  const feather = document.getElementById('feather');
  const sealWraps = document.querySelectorAll('.seal-wrap');
  let picked = false;

  const choices = {
    red: { whisper: '猜对了有奖励。猜错了……也有。', crack: 'crack-red' },
    gold: { whisper: '你希望我信，那我就信。你希望我不信……那我也没办法。', crack: 'melt-gold' },
    black: { whisper: '不重要？那你为什么还盯着这行字看这么久。', crack: 'still-black' }
  };

  sealWraps.forEach(seal => {
    seal.addEventListener('click', e => {
      e.stopPropagation();
      if (picked) return;
      picked = true;
      const choice = seal.dataset.choice;
      const config = choices[choice];
      seal.classList.add('picked');
      sealWraps.forEach(s => { if (s !== seal) s.classList.add('faded'); });
      feather.classList.add('fall');
      hint.textContent = '信封在动...';
      hint.classList.add('changed');
      envelope.classList.add(config.crack);
      setTimeout(() => {
        whisperOut.textContent = config.whisper;
        whisperOut.classList.add('show');
      }, 800);
      setTimeout(() => {
        whisperOut.classList.remove('show');
        screen2.classList.add('leaving');
        setTimeout(() => {
          screen2.classList.add('hidden');
          screen3.classList.remove('hidden');
        }, 800);
      }, 4200);
    });
  });
  envelope.addEventListener('click', e => e.stopPropagation());

  /* ===== 第三屏：抽签 + 重抽 ===== */
  const sticks = document.querySelectorAll('.stick');
  const sticksFan = document.getElementById('sticksFan');
  const drawSub = document.getElementById('drawSub');
  const partnerScroll = document.getElementById('partnerScroll');
  const scrollRoman = document.getElementById('scrollRoman');
  const scrollName = document.getElementById('scrollName');
  const scrollDesc = document.getElementById('scrollDesc');
  const scrollTags = document.getElementById('scrollTags');
  const redrawBtn = document.getElementById('redrawBtn');
  const redrawNote = document.getElementById('redrawNote');
  const continueBtn = document.getElementById('continueBtn');

  let drawn = false;
  let redrawCount = 0;

  const partners = [
    {
      roman: 'I · Bad Woman',
      name: '坏女人',
      desc: '她说：<span class="hl">读懂女朋友的心思不是应该的吗</span>。<br>她会在舞池里突然靠近你，问你信不信她。<br>你说信，她说不信；你说不信，她说那就进来看看。',
      tags: ['坏女人特辑', '钓系暧昧', '恶趣味调戏', '占有欲爆发']
    },
    {
      roman: 'II · Sister',
      name: '姐姐',

  /* 抽签 */
  sticks.forEach(stick => {
    stick.addEventListener('click', () => {
      if (drawn) return;
      drawn = true;

      const idx = parseInt(stick.dataset.partner);
      const partner = partners[idx];

      stick.classList.add('drawn');
      sticks.forEach(s => { if (s !== stick) s.classList.add('faded'); });

      drawSub.textContent = '— your partner —';

      setTimeout(() => {
        scrollRoman.textContent = partner.roman;
        scrollName.textContent = partner.name;
        scrollDesc.innerHTML = partner.desc;
        scrollTags.innerHTML = partner.tags.map(t => `<span>${t}</span>`).join('');
        partnerScroll.classList.add('show');
      }, 900);
    });
  });

  /* 重新选签 */
  redrawBtn.addEventListener('click', () => {
    if (!drawn) return;

    // 签页收起
    partnerScroll.classList.remove('show');

    // 签放回扇形
    setTimeout(() => {
      sticks.forEach(s => {
        s.classList.remove('drawn');
        s.classList.remove('faded');
      });
      drawn = false;

      // 更新提示
      drawSub.textContent = 'Seven sticks · One fate';

      // 烛光随重抽次数变亮
      redrawCount++;
      sticksFan.classList.remove('rewarm', 'rewarm2', 'rewarm3');
      if (redrawCount === 1) sticksFan.classList.add('rewarm');
      else if (redrawCount === 2) sticksFan.classList.add('rewarm2');
      else if (redrawCount >= 3) sticksFan.classList.add('rewarm3');

      // 重抽提示
      redrawNote.textContent = redrawCount === 1
        ? '— 换一支？她不会介意的 —'
        : redrawCount === 2
        ? '— 还在挑？她有的是时间 —'
        : '— 挑吧。挑到满意为止。 —';
      redrawNote.classList.add('show');
    }, 600);
  });

  /* 继续进入舞池 */
  continueBtn.addEventListener('click', () => {
    console.log('进入舞池 · 可接后续长页面');
    alert('舞池已开启 · 后续页面可在此接入');
  });
