<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #4a3b45;
      line-height: 1.9;
      background: #fdf6f8;
    }

    section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 20px;
      text-align: center;
      scroll-snap-align: start;
    }
    section:nth-child(odd) { background: #fdf6f8; }
    section:nth-child(even) { background: #f7eef2; }

    h2 {
      font-size: 32px;
      font-weight: 700;
      color: #6b4a58;
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 16px;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 3px;
      background: #c98da8;
      border-radius: 2px;
    }
    p {
      font-size: 17px;
      max-width: 620px;
      color: #8a6a78;
    }

    .page-wrap {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y proximity;
      -webkit-overflow-scrolling: touch;
    }

    .tag {
      display: inline-block;
      background: #c98da8;
      color: #fff;
      padding: 8px 20px;
      border-radius: 24px;
      margin: 6px;
      font-size: 15px;
      font-weight: 500;
    }

    /* ===== 第一页 ===== */
    #home {
      background: linear-gradient(160deg, #fdf6f8 0%, #f9e8ef 40%, #f3dde8 70%, #e8d0e0 100%);
    }
    .popup-box {
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(249,232,239,0.9));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 56px 44px;
      box-shadow:
        0 12px 40px rgba(201,141,168,0.25),
        inset 0 0 30px rgba(255,255,255,0.5);
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(201,141,168,0.25);
      opacity: 0;
      transform: scale(0.85) translateY(20px);
      animation: popupIn 0.9s ease-out 1s forwards;
    }
    @keyframes popupIn {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .popup-box h1 {
      font-size: 24px;
      color: #6b4a58;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
      line-height: 1.7;
      font-weight: 700;
    }
    .popup-btns {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .popup-btns button {
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 30px;
      border: 2px solid #c98da8;
      cursor: pointer;
      transition: all 0.25s;
      touch-action: manipulation;
    }
    .btn-yes {
      background: #c98da8;
      color: #fff;
    }
    .btn-yes:active { background: #b07a94; transform: scale(0.97); }
    .btn-no {
      background: transparent;
      color: #c98da8;
    }
    .btn-no:active { background: rgba(201,141,168,0.12); transform: scale(0.97); }

    /* ===== 第二页 ===== */
    #about {
      background: linear-gradient(160deg, #fdf6f8 0%, #f9e8ef 40%, #f3dde8 70%, #e8d0e0 100%);
      padding: 60px 20px;
      justify-content: flex-start;
    }
    .about-page {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      text-align: left;
    }

    /* 第一部分：头像 + 名字 + 一句话 */
    .part-one {
      display: flex;
      align-items: flex-end;
      gap: 20px;
    }
    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #c98da8;
      box-shadow: 0 8px 24px rgba(201,141,168,0.3);
    }
    .avatar-name {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #6b4a58;
      letter-spacing: 2px;
    }
    .one-line {
      font-family: "SimSun", "宋体", serif;
      font-size: 20px;
      color: #6b4a58;
      line-height: 1.8;
      padding-bottom: 8px;
    }

    /* 第二、三、四部分：对话框 */
    .dialog-box {
      background: #fff;
      border: 1px solid rgba(201,141,168,0.25);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 6px 20px rgba(201,141,168,0.12);
      font-size: 17px;
      color: #8a6a78;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s ease-out forwards;
    }
    .dialog-box:nth-child(2) { animation-delay: 0.3s; }
    .dialog-box:nth-child(3) { animation-delay: 0.6s; }
    .dialog-box:nth-child(4) { animation-delay: 0.9s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 手机竖屏自适应 */
    @media (max-width: 600px) {
      section { padding: 50px 16px; }
      .popup-box { padding: 44px 24px; border-radius: 18px; }
      .popup-box h1 { font-size: 20px; }
      .popup-btns button { font-size: 14px; padding: 11px 22px; }
      h2 { font-size: 26px; }
      p { font-size: 16px; }

      #about { padding: 50px 18px; }
      .about-page { gap: 22px; }

      .part-one {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .avatar-wrap {
        flex-direction: row;
        align-items: center;
        gap: 12px;
      }
      .avatar { width: 80px; height: 80px; }
      .avatar-name {
        margin-top: 0;
        font-size: 17px;
      }
      .one-line {
        font-size: 18px;
        padding-bottom: 0;
      }
      .dialog-box {
        font-size: 16px;
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    <!-- 第一页：互动弹窗 -->
    <section id="home">
      <div class="popup-box">
        <h1>“手拉手是什么感觉”</h1>
        <div class="popup-btns">
          <button class="btn-yes" onclick="chooseYes()">a</button>
          <button class="btn-no" onclick="chooseNo()">b</button>
        </div>
      </div>
    </section>

    <!-- 第二页：四部分布局 -->
    <section id="about">
      <div class="about-page">

        <!-- 第一部分 -->
        <div class="part-one">
          <div class="avatar-wrap">
            <img src="avatar.jpg" alt="琥珀" class="avatar">
            <div class="avatar-name">琥珀</div>
          </div>
          <div class="one-line">直到世界毁灭，独留你我二人</div>
        </div>

        <!-- 第二部分 -->
        <div class="dialog-box">“aaaa”</div>

        <!-- 第三部分 -->
        <div class="dialog-box">“bbbbb”</div>

        <!-- 第四部分 -->
        <div class="dialog-box">“cccc”</div>

      </div>
    </section>

    <!-- 第三页：标签 -->
    <section id="skills">
      <h2>我的标签</h2>
      <div>
        <span class="tag">爱学习</span>
        <span class="tag">爱折腾</span>
        <span class="tag">GitHub 新手</span>
      </div>
    </section>

    <!-- 第四页：联系 -->
    <section id="contact">
      <h2>联系我</h2>
      <p>邮箱：你的邮箱@example.com</p>
    </section>

  </div>

  <script>
    function chooseYes() {
      document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
    }
    function chooseNo() {
      document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
</body>
</html>
