<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #1e3a5f;
      line-height: 1.9;
      overflow: hidden;
      background: #ffffff;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(30,58,95,0.08);
      display: flex;
      justify-content: center;
      gap: 36px;
      padding: 18px;
      z-index: 100;
    }
    nav a {
      text-decoration: none;
      color: #5a7a9a;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: color 0.25s;
    }
    nav a:hover { color: #1e6fd9; }

    .page-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    section {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 24px;
      text-align: center;
    }
    section:nth-child(odd) { background: #ffffff; }
    section:nth-child(even) { background: #eef5fd; }

    h1 {
      font-size: 48px;
      font-weight: 800;
      color: #1e3a5f;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    h2 {
      font-size: 36px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 16px;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 3px;
      background: #1e6fd9;
      border-radius: 2px;
    }
    p {
      font-size: 18px;
      max-width: 620px;
      color: #5a7a9a;
    }

    .tag {
      display: inline-block;
      background: #1e6fd9;
      color: #fff;
      padding: 8px 20px;
      border-radius: 24px;
      margin: 8px;
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .tag:hover { transform: translateY(-3px); }

    .arrows {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    .arrow {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 2px 12px rgba(30,58,95,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: #1e6fd9;
      user-select: none;
      transition: all 0.25s;
    }
    .arrow:hover {
      background: #1e6fd9;
      color: #fff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home">首页</a>
    <a href="#about">关于我</a>
    <a href="#skills">技能</a>
    <a href="#contact">联系</a>
  </nav>

  <div class="page-container" id="pageContainer">

    <section id="home">
      <h1>你好，我是 ___</h1>
      <p>一个正在学习编程的新手，正在用 GitHub 搭建自己的第一个网站。</p>
    </section>

    <section id="about">
      <h2>关于我</h2>
      <p>这里写你的自我介绍。比如你的爱好、正在学的东西、或者任何你想说的话。</p>
    </section>

    <section id="skills">
      <h2>我的标签</h2>
      <div>
        <span class="tag">爱学习</span>
        <span class="tag">爱折腾</span>
        <span class="tag">GitHub 新手</span>
      </div>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <p>邮箱：你的邮箱@example.com</p>
    </section>

  </div>

  <div class="arrows">
    <div class="arrow" onclick="scrollUp()">↑</div>
    <div class="arrow" onclick="scrollDown()">↓</div>
  </div>

  <script>
    const container = document.getElementById('pageContainer');
    const pageHeight = window.innerHeight;

    function scrollDown() {
      container.scrollBy({ top: pageHeight, behavior: 'smooth' });
    }
    function scrollUp() {
      container.scrollBy({ top: -pageHeight, behavior: 'smooth' });
    }

    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const target = document.querySelector(link.getAttribute('href'));
        container.scrollTo({ top: target.offsetTop, behavior: 'smooth' });
      });
    });
  </script>

</body>
</html>
